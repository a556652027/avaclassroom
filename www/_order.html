﻿﻿﻿﻿﻿﻿<!--
    頁面架構會分為 選單 與 內容兩部分
    內容會再依照頁面去選擇不同的功能頁面
-->
<!doctype html>
<html>
  <head>
    <title>RWD 選單範例</title>
    <link rel="icon" href="assets/images/favicon.ico" />
    <script src="modules/app.module.def.js"></script>
    <script type="text/javascript" src="locales/app.locale.js"></script>
    <script type="text/javascript" src="modules/app.module.order.js"></script>

    <!-- 使用sidebar 的樣式-->
    <!-- <link rel="stylesheet" href="components/app.component.frame.sidebar-nav.css"> -->
    <style>
      /* 靜態 Loading 遮罩樣式 */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        z-index: 99999;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        transition: opacity 0.3s ease-out;
      }
      #initial-loader .scan {
        text-align: center;
      }
      #initial-loader img {
        width: 300px;
        height: 300px;
        margin-bottom: 10px;
      }
      #initial-loader .loading-text {
        font-size: 60px;
        color: #92bfff;
        font-family: sans-serif;
        font-weight: bold;
        animation: blink 1.5s infinite;
      }
      @keyframes blink {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <!-- [新增] 靜態 Loading 元素，JS 載入前就會顯示 -->
    <div id="initial-loader">
      <div class="scan">
        <img
          src="assets/images/Group (3).svg"
          alt="Loading..."
          onerror="this.style.display = 'none'"
        />
        <div class="fingerprint">
          <span class="loading-text">Loading...</span>
        </div>
      </div>
    </div>

    <div id="app" style="visibility: hidden">
      <!-- 擺放sideber 的位置 -->
      <div id="sidebar-nav-container"></div>

      <!-- _________________________________________________________________-->
      <!-- 實際內容-->

      <!-- 第一頁 訂單列表-->
      <div class="page" id="page01">
        <div class="content">
          <div class="page-caption">
            <h1>{{order.title_list_order}}</h1>
          </div>
          <!-- 訂單列表 -->
          <table class="frame-table">
            <tr>
              <td colspan="1" style="width: 100px"></td>
              <!-- 間隔用的 td -->
              <td colspan="2">
                <label for="begin_time">{{order.list_label_begin_time}}</label>
                <input
                  id="begin_time"
                  type="date"
                  name="begin_time"
                  placeholder="{{order.list_label_begin_time}}..."
                  value=""
                  required
                />
              </td>
              <td colspan="1" style="width: 100px"></td>
              <!-- 間隔用的 td -->
              <td colspan="2">
                <label for="end_time">{{order.list_label_end_time}}</label>
                <input
                  id="end_time"
                  type="date"
                  name="end_time"
                  placeholder="{{order.list_label_end_time}}..."
                  value=""
                  required
                />
              </td>
              <td colspan="1" style="width: 100px"></td>
              <!-- 間隔用的 td -->
              <td colspan="1">
                <button
                  type="button"
                  id="order_list_time_search_button"
                  class="image_button_005"
                >
                  {{common.search}}
                </button>
              </td>
              <td colspan="1" style="width: 100px"></td>
              <!-- 間隔用的 td -->
              <td colspan="1">
                <button
                  type="button"
                  id="order_list-button-gotopage_addnew_order"
                  class="image_button_005"
                >
                  {{common.addnew}}
                </button>
              </td>
            </tr>
            <!-- 顯示資料的地方 -->
            <tr>
              <td colspan="10">
                <div class="viewpoint-container">
                  <table
                    id="order_list-order_information"
                    class="responstable"
                  ></table>
                </div>
              </td>
            </tr>
            <!-- 顯示分頁的地方 -->
            <tr>
              <td colspan="10">
                <span id="order_list-order_pagination"></span>
              </td>
            </tr>
          </table>
        </div>
      </div>

      <!-- 第二頁新增訂單-->
      <div class="page" id="page02">
        <div class="content">
          <div class="page-caption">
            <h1>{{order.title_addnew_order}}</h1>
          </div>
          <table class="frame-table">
            <tr>
              <td colspan="1">
                <label for="begin_time"
                  >{{order.addnew_label_begin_time}}</label
                >
                <input
                  id="begin_time"
                  type="date"
                  name="begin_time"
                  placeholder="{{order.addnew_label_begin_time}}..."
                  value=""
                  required
                />
              </td>
              <td colspan="1">
                <label for="valid_days"
                  >{{order.addnew_label_valid_days}}</label
                >
                <input
                  id="valid_days"
                  type="text"
                  name="valid_days"
                  placeholder="{{order.addnew_label_valid_days}}..."
                  value=""
                  required
                />
              </td>
            </tr>
            <tr>
              <td colspan="2">
                <label for="valid_counts"
                  >{{order.addnew_label_valid_counts}}</label
                >
                <input
                  id="valid_counts"
                  type="number"
                  name="valid_counts"
                  placeholder="{{order.addnew_label_valid_counts}}..."
                  value=""
                  required
                />
              </td>
            </tr>
          </table>
        </div>
      </div>
    </div>
    <!-- _________________________________________________________________-->

    <!-- 使用sidebar 的樣式-->
    <script
      type="text/javascript"
      src="components/app.component.frame.sidebar-nav.js"
    ></script>

    <!-- 請把 view 的相關 js放最前面 以免render後導致監聽事件失效-->
    <script type="text/javascript" src="views/app.view.order.js"></script>
  </body>
</html>
