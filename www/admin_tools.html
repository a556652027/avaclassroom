<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>License Management System</title>
    <link rel="icon" href="assets/images/favicon.ico" />

    <!-- 載入核心模組與多語言 -->
    <script src="modules/app.module.def.js"></script>
    <script type="text/javascript" src="locales/app.locale.js"></script>

    <!-- 載入進階工具模組 -->
    <script
      type="text/javascript"
      src="modules/app.module.admin_tools.js"
    ></script>

    <style>
      body {
        background-color: #f5f7fa;
        font-family: "Inter", sans-serif;
      }
      .test-container {
        max-width: 600px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }
      .form-group {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
      }
      .form-group label {
        font-weight: bold;
        margin-bottom: 8px;
        color: #404040;
      }
      .form-group input {
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
      }
      .btn-submit {
        background-color: #214f7c;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
        transition: background-color 0.2s;
      }
      .btn-submit:hover {
        background-color: #ee963f;
      }
    </style>
  </head>

  <body>
    <!-- 靜態 Loading 元素 -->
    <div id="initial-loader">
      <div class="scan">
        <img
          src="assets/images/Group (3).svg"
          alt="Loading..."
          onerror="this.style.display = 'none'"
        />
        <div class="fingerprint">
          <span class="loading-text">Loading...</span>
        </div>
      </div>
    </div>

    <div
      id="app"
      style="
        visibility: hidden;
        display: flex;
        flex-direction: column;
        height: 100vh;
      "
    >
      <!-- 將導覽列移至 app 容器頂層，確保其獨立於頁面內容且始終可見 -->
      <div id="navbar-container"></div>

      <!-- 【架構與 UI 修補】開啟垂直卷軸，設定高度，解決畫面過長被截斷的問題 -->
      <div
        id="page01"
        class="page"
        style="
          display: none;
          flex: 1;
          overflow-y: auto;
          padding-bottom: 80px;
          box-sizing: border-box;
        "
      >
        <div class="test-container">
          <div style="display: flex; align-items: center; margin-bottom: 20px">
            <img
              src="assets/images/edit.svg"
              alt=""
              style="width: 24px; height: 24px; margin-right: 10px"
            />
            <h2 style="margin: 0; color: #214f7c">
              {{sidebarnav.admin_tools}}
            </h2>
          </div>

          <!-- 【架構擴充】系統快取管理 -->
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 20px;
              background: #fef2f2;
              padding: 15px;
              border-radius: 8px;
              border: 1px solid #fca5a5;
            "
          >
            <div>
              <h3 style="margin: 0; color: #b91c1c; font-size: 16px">
                系統快取管理 (System Cache)
              </h3>
              <p style="margin: 5px 0 0 0; font-size: 13px; color: #7f1d1d">
                資料庫發生外部變更 (如手動刪除資料) 時，強制與記憶體同步。
              </p>
            </div>
            <button
              id="btn-execute-rebuild-cache"
              class="btn-submit"
              style="background-color: #ef4444; width: auto; padding: 10px 20px"
            >
              重建快取
            </button>
          </div>
          <hr
            style="margin: 30px 0; border: none; border-top: 1px solid #e5e7eb"
          />

          <div class="form-group">
            <label for="test-license-cid"
              >目標金鑰 (License CID) 或 序號 (Product Key)</label
            >
            <input
              type="text"
              id="test-license-cid"
              placeholder="請輸入序號..."
            />
          </div>

          <div class="form-group">
            <label for="test-reset-count">要重置的次數</label>
            <input
              type="number"
              id="test-reset-count"
              value="3"
              min="1"
              max="99"
            />
          </div>

          <button id="btn-execute-reset" class="btn-submit">執行重置</button>

          <div style="display: flex; gap: 10px; margin-top: 15px">
            <button
              id="btn-execute-enable"
              class="btn-submit"
              style="background-color: #10b981"
            >
              啟用金鑰
            </button>
            <button
              id="btn-execute-disable"
              class="btn-submit"
              style="background-color: #ef4444"
            >
              停用金鑰
            </button>
          </div>

          <!-- 【架構擴充】新增金鑰專屬區塊 -->
          <hr
            style="margin: 30px 0; border: none; border-top: 1px solid #e5e7eb"
          />
          <div style="display: flex; align-items: center; margin-bottom: 20px">
            <h2 style="margin: 0; color: #214f7c">新增手動金鑰 (Add Key)</h2>
          </div>

          <div style="display: flex; gap: 10px">
            <div class="form-group" style="flex: 1">
              <label for="test-add-product">產品名稱 (Product)</label>
              <input
                type="text"
                id="test-add-product"
                placeholder="ex: avacast"
              />
            </div>
            <div class="form-group" style="flex: 1">
              <label for="test-add-version">版本 (Version)</label>
              <input type="text" id="test-add-version" placeholder="ex: mac" />
            </div>
          </div>

          <div class="form-group">
            <label for="test-add-key">金鑰序號 (Key - 35 碼包含連字號)</label>
            <input
              type="text"
              id="test-add-key"
              placeholder="輸入要配發的 35 碼金鑰..."
            />
          </div>

          <div style="display: flex; gap: 10px">
            <div class="form-group" style="flex: 1">
              <label for="test-add-valid-date">有效期限 (Valid Date)</label>
              <!-- 注意：datetime-local 格式支援 YYYY-MM-DDThh:mm -->
              <input type="datetime-local" id="test-add-valid-date" />
            </div>
            <div class="form-group" style="flex: 1">
              <label for="test-add-duration">授權月數 (Duration)</label>
              <input type="number" id="test-add-duration" value="12" min="1" />
            </div>
          </div>

          <div style="display: flex; gap: 10px">
            <div class="form-group" style="flex: 1">
              <label for="test-add-unreg-count">解綁次數</label>
              <input
                type="number"
                id="test-add-unreg-count"
                value="3"
                min="0"
              />
            </div>
            <div class="form-group" style="flex: 1">
              <label for="test-add-app-param">應用參數 (App Param)</label>
              <input type="text" id="test-add-app-param" value="0" />
            </div>
          </div>

          <button
            id="btn-execute-add"
            class="btn-submit"
            style="background-color: #f59e0b"
          >
            配發金鑰
          </button>

          <!-- 【架構擴充】批次產生金鑰專屬區塊 -->
          <hr
            style="margin: 30px 0; border: none; border-top: 1px solid #e5e7eb"
          />
          <div style="display: flex; align-items: center; margin-bottom: 20px">
            <h2 style="margin: 0; color: #214f7c">
              批次產生金鑰 (Bulk Genkey)
            </h2>
          </div>

          <div style="display: flex; gap: 10px">
            <div class="form-group" style="flex: 1">
              <label for="test-bulk-product">產品名稱 (Product)</label>
              <input
                type="text"
                id="test-bulk-product"
                placeholder="ex: avacast"
              />
            </div>
            <div class="form-group" style="flex: 1">
              <label for="test-bulk-version">版本 (Version)</label>
              <input type="text" id="test-bulk-version" placeholder="ex: mac" />
            </div>
          </div>
          <div style="display: flex; gap: 10px">
            <div class="form-group" style="flex: 2">
              <label for="test-bulk-license"
                >母鑰 (License)
                <span
                  style="color: #10b981; font-weight: normal; font-size: 12px"
                  >*留空將自動產生</span
                ></label
              >
              <input
                type="text"
                id="test-bulk-license"
                placeholder="可留空..."
              />
            </div>
            <div class="form-group" style="flex: 1">
              <label for="test-bulk-amount">數量 (1~100)</label>
              <input
                type="number"
                id="test-bulk-amount"
                value="10"
                min="1"
                max="100"
              />
            </div>
          </div>
          <div style="display: flex; gap: 10px">
            <button
              id="btn-execute-bulk"
              class="btn-submit"
              style="background-color: #8b5cf6; flex: 1"
            >
              自動批次生產
            </button>
            <button
              id="btn-execute-bulk-revoke"
              class="btn-submit"
              style="background-color: #ef4444; flex: 1; display: none"
            >
              作廢上一批 (Undo)
            </button>
          </div>

          <div class="form-group" style="margin-top: 15px">
            <label>生產結果 (供複製)</label>
            <textarea
              id="test-bulk-result"
              rows="6"
              readonly
              style="
                width: 100%;
                padding: 10px;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                font-family: monospace;
                resize: vertical;
                box-sizing: border-box;
              "
            ></textarea>
          </div>

          <div style="margin-top: 20px; text-align: center">
            <a
              href="dashboard.html"
              style="color: #92bfff; text-decoration: none; font-size: 14px"
              >返回儀表板</a
            >
          </div>
        </div>
      </div>
    </div>

    <!-- 載入 Navbar 以保持基本視覺一致性 -->
    <script
      type="text/javascript"
      src="components/app.component.frame.navbar.js?v=5.0"
    ></script>

    <!-- 補齊缺失的帳號設定 (Profile Modal) 模組與元件 -->
    <script type="text/javascript" src="modules/app.module.profile.js"></script>
    <script
      type="text/javascript"
      src="components/app.component.profile.modal.js"
    ></script>

    <!-- 載入專屬視圖邏輯 -->
    <script type="text/javascript" src="views/app.view.admin_tools.js"></script>
  </body>
</html>
