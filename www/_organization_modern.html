<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新增組織</title>
    <link rel="icon" href="assets/images/favicon.ico">
  </head>
  <style>
    /* 調淺 Placeholder 顏色 */
    input::placeholder, 
    textarea::placeholder {
      color: #d1d5db !important;
      opacity: 1;
    }
  </style>
  <body style="margin: 0; font-family: Arial, sans-serif; background: #f9f9f9">
    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      "
    >
      <form
        style="
          background: #fff;
          padding: 2rem;
          border-radius: 15px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
          width: 90%;
          max-width: 900px;
        "
      >
        <!-- 標題區 -->
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <div style="display: flex; align-items: center; gap: 12px">
            <img src="assets/images/add_group_icon.svg" alt="" />
            <h1 style="font-size: 24px; font-weight: 600; margin: 0">
              {{organization.title_insert_organization}}
            </h1>
          </div>
          <img src="assets/images/X.svg" alt="close" style="cursor: pointer" />
        </div>

        <!-- AVA產品 -->
        <div style="margin-top: 1rem">
          <label
            style="
              display: block;
              font-size: 14px;
              font-weight: 500;
              color: #898c94;
              margin-bottom: 0.5rem;
            "
            >AVA 產品</label
          >
          <div style="display: flex; gap: 12px; flex-wrap: wrap">
            <label
              style="
                display: flex;
                align-items: center;
                font-size: 14px;
                color: #898c94;
                cursor: pointer;
              "
            >
              <input type="checkbox" style="margin-right: 6px" /> AVACAST
            </label>
            <label
              style="
                display: flex;
                align-items: center;
                font-size: 14px;
                color: #898c94;
                cursor: pointer;
              "
            >
              <input type="checkbox" style="margin-right: 6px" /> IllumiNet
            </label>
            <label
              style="
                display: flex;
                align-items: center;
                font-size: 14px;
                color: #898c94;
                cursor: pointer;
              "
            >
              <input type="checkbox" style="margin-right: 6px" /> AVA Classroom
            </label>
          </div>
        </div>

        <!-- 組織代碼/名稱 -->
        <div style="display: flex; gap: 20px; margin-top: 1rem">
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.group_cid}}</label
            >
            <input
              id="organization_insert-group_cid"
              type="text"
              name="organization_insert-group_cid"
              placeholder="{{organization.group_cid_hint}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #898c94;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.group_name}}</label
            >
            <input
              id="organization_insert-group_name"
              type="text"
              name="organization_insert-group_name"
              placeholder="{{organization.group_name_hint}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #333;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
        </div>

        <!-- 組織類型/擁有者代碼 -->
        <div style="display: flex; gap: 20px; margin-top: 1rem">
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.group_type}}</label
            >
            <input
              id="organization_insert-group_type"
              type="text"
              name="organization_insert-group_type"
              placeholder="{{organization.group_type_hint}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #333;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.owner_cid}}</label
            >
            <input
              id="organization_insert-owner_cid"
              type="text"
              name="organization_insert-owner_cid"
              placeholder="{{organization.owner_cid_hint}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #333;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
        </div>

        <!-- 聯絡人/統一編號 -->
        <div style="display: flex; gap: 20px; margin-top: 1rem">
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.contact}}</label
            >
            <input
              id="organization_insert-contact"
              type="text"
              name="organization_insert-contact"
              placeholder="{{organization.contact_hint}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #333;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.group_ubn}}</label
            >
            <input
              id="organization_insert-group_ubn"
              type="text"
              name="organization_insert-group_ubn"
              placeholder="{{organization.group_ubn_hint}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #333;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
        </div>

        <!-- 聯絡電話/信箱 -->
        <div style="display: flex; gap: 20px; margin-top: 1rem">
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.contact_phone_01}}</label
            >
            <input
              id="organization_insert-contact_phone_01"
              type="text"
              name="organization_insert-contact_phone_01"
              placeholder="{{organization.contact_phone_01_hint}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #333;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.contact_email_01}}</label
            >
            <input
              id="organization_insert-contact_email_01"
              type="text"
              name="organization_insert-contact_email_01"
              placeholder="{{organization.contact_email_01_hint}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #333;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
        </div>

        <!-- 城市/國家 -->
        <div style="display: flex; gap: 20px; margin-top: 1rem">
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.city}}</label
            >
            <input
              id="organization_insert-city"
              type="text"
              name="organization_insert-city"
              placeholder="{{organization.city_hint}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #333;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.country}}</label
            >
            <input
              id="organization_insert-country"
              type="text"
              name="organization_insert-country"
              placeholder="{{organization.country}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #333;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
        </div>

        <!-- 地址/帳單地址 -->
        <div style="display: flex; gap: 20px; margin-top: 1rem">
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.address}}</label
            >
            <input
              id="organization_insert-address"
              type="text"
              name="organization_insert-address"
              placeholder="{{organization.address_hint}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #333;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
          <div style="flex: 1">
            <label
              style="
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: #898c94;
                margin-bottom: 0.5rem;
              "
              >{{organization.billing_addr}}</label
            >
            <input
              id="organization_insert-billing_addr"
              type="text"
              name="organization_insert-billing_addr"
              placeholder="{{organization.billing_addr_hint}}"
              value=""
              autocomplete="off"
              style="
                width: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #333;
                border: 1px solid #e5e8ea;
                border-radius: 6px;
              "
              required
            />
          </div>
        </div>

        <!-- 備註 -->
        <div style="margin-top: 1rem">
          <label
            style="
              display: block;
              font-size: 14px;
              font-weight: 500;
              color: #898c94;
              margin-bottom: 0.5rem;
            "
            >{{common.note00}}</label
          >
          <textarea
            id="organization_insert-note00"
            name="organization_insert-note00"
            placeholder="{{common.note00_hint}}"
            style="
              width: 100%;
              height: 80px;
              padding: 8px 12px;
              font-size: 14px;
              color: #333;
              border: 1px solid #e5e8ea;
              border-radius: 6px;
              resize: vertical;
            " 
          autocomplete="off"></textarea>
        </div>

        <!-- 表單底部按鈕 -->
        <div style="display: flex; justify-content: flex-end; margin-top: 28px">
          <button
            id="organization_insert-button-cancel"
            type="button"
            style="
              padding: 12px;
              width: 130px;
              height: 48px;
              font-size: 14px;
              border-radius: 10px;
              border: 1px solid #e5e8ea;
              background: #fff;
              color: #898c94;
              margin-right: 20px;
              cursor: pointer;
            "
          >
            {{common.cancel}}
          </button>
          <button
            id="organization_insert-button-ok"
            type="submit"
            style="
              padding: 12px;
              width: 130px;
              height: 48px;
              font-size: 14px;
              border-radius: 10px;
              border: 1px solid #e5e8ea;
              background: #214f7c;
              color: #fff;
              cursor: pointer;
            "
          >
            {{common.ok}}
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
