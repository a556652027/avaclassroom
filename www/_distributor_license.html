<!doctype html>
<html>
  <head>
    <title>License Management System</title>
    <link rel="icon" href="assets/images/favicon.ico" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://cdn.jsdelivr.net/npm/ https://cdn.sheetjs.com/ 'unsafe-inline';
        style-src 'self' https://cdn.jsdelivr.net/npm/ https://fonts.googleapis.com/ 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self' https://fonts.gstatic.com/;
        connect-src 'self' https://lms.narvitech.com/ http://127.0.0.1:8023;
        frame-src 'none';
        object-src 'none';
    "
    />
    <script src="modules/app.module.def.js"></script>
    <script type="text/javascript" src="locales/app.locale.js"></script>
    <script type="text/javascript" src="modules/app.module.device.js"></script>
    <script type="text/javascript" src="modules/app.module.history.js"></script>
    <script type="text/javascript" src="views/app.html.utility.js"></script>
    <!-- 標題動態更新 -->
    <script
      type="text/javascript"
      src="scripts/lib/lib.title.groupcid.js"
    ></script>
    <!-- SheetJS 庫 for Excel 匯出 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

    <link rel="stylesheet" href="css/layout.style.button.css" />
    <link rel="stylesheet" href="css/layout.style.select.css" />
    <link rel="stylesheet" href="css/layout.select.color.css" />

    <style>
      /* 下載按鈕 hover 效果 */
      #device-download-button:hover {
        background-color: #92bfff !important;
      }

      /* 匯出全部按鈕 hover 效果 */
      #device-download-all-button:hover {
        background-color: #92bfff !important;
      }

      /* 全選 checkbox 顏色樣式 */
      #selectAll {
        margin-right: 0.5rem;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border: 1px solid #d1d5db;
        border-radius: 3px;
        background-color: white;
      }

      #selectAll:checked {
        border: 1px solid #ee963f;
        background-color: #ee963f;
        border-color: #ee963f;
      }

      /* 表格行 checkbox 顏色樣式 */
      .row-checkbox {
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border: 1px solid #d1d5db;
        border-radius: 3px;
        background-color: white;
      }

      .row-checkbox:checked {
        border: 1px solid #ee963f;
        background-color: #ee963f;
        border-color: #ee963f;
      }
    </style>
  </head>

  <body>
    <!-- [新增] 靜態 Loading 元素，JS 載入前就會顯示 -->
    <div id="initial-loader">
      <div class="scan">
        <img
          src="assets/images/Group (3).svg"
          alt="Loading..."
          onerror="this.style.display = 'none'"
        />
        <div class="fingerprint">
          <span class="loading-text">Loading...</span>
        </div>
      </div>
    </div>

    <div id="app" style="visibility: hidden; flex-direction: column">
      <div id="navbar-distributor-container"></div>

      <div style="display: flex; height: calc(100vh - 72px)">
        <div id="sidebar-distributor-container"></div>
        <div
          style="display: flex; flex-direction: column; flex: 1; min-width: 0"
        >
          <div id="nav-container"></div>

          <div
            class="content"
            style="
              flex: 1;
              overflow-y: auto;
              overflow-x: scroll;
              padding: 2rem 2.5rem;
            "
          >
            <div class="page" id="page01" style="min-width: 1400px">
              <div class="page-caption" style="display: flex">
                <div class="page-icon-container" style="margin-right: 10px">
                  <img
                    src="assets/images/IdentificationBadge.svg"
                    alt=""
                    class="page-icon"
                  />
                </div>
                <h1 id="device-title" style="margin-top: 3px">
                  {{device.title_list_device}}
                </h1>
              </div>

              <div
                style="
                  margin-top: 20px;
                  background: #e5e8ea;
                  height: 70px;
                  border-top-left-radius: 8px;
                  border-top-right-radius: 8px;
                  padding: 0 16px;
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                "
              >
                <div style="display: flex; align-items: center">
                  <input type="checkbox" id="selectAll" />
                  <label
                    for="selectAll"
                    style="
                      display: flex;
                      align-items: center;
                      font-size: 14px;
                      color: #374151;
                      cursor: pointer;
                      margin-right: 8px;
                    "
                  >
                    全選
                  </label>
                  <button
                    id="device-download-button"
                    onclick="downloadSelectedDevicesExcel()"
                    style="
                      border: 1px solid #92bfff;
                      border-radius: 9999px;
                      width: 56px;
                      height: 30px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      cursor: pointer;
                      margin-left: 12px;
                    "
                  >
                    <img
                      id="device-download-icon"
                      src="assets/images/download.svg"
                      alt="下載"
                      style="width: 20px; height: 20px"
                    />
                  </button>
                  <button
                    type="button"
                    id="device-download-all-button"
                    onclick="downloadAllDevices()"
                    style="
                      border: 1px solid #92bfff;
                      border-radius: 9999px;
                      width: 56px;
                      height: 30px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      cursor: pointer;
                      margin-left: 12px;
                    "
                    title="匯出全部"
                  >
                    <img
                      id="device-download-all-icon"
                      src="assets/images/download_all_light_blue.svg"
                      alt="匯出全部"
                      style="width: 20px; height: 20px; object-fit: contain"
                    />
                  </button>
                </div>

                <div style="display: flex; gap: 8px; align-items: flex-end">
                  <div style="display: flex; flex-direction: column">
                    <label
                      for="device_list-begin_time"
                      style="font-size: 12px; color: #666; margin-bottom: 2px"
                      >{{device.search_date_start}}</label
                    >
                    <input
                      id="device_list-begin_time"
                      type="date"
                      style="
                        padding: 6px 8px;
                        border: 1px solid #ddd;
                        border-radius: 4px;
                        font-size: 14px;
                        height: 38px;
                        box-sizing: border-box;
                      "
                      title="選擇開始日期"
                    />
                  </div>
                  <div style="display: flex; flex-direction: column">
                    <label
                      for="device_list-end_time"
                      style="font-size: 12px; color: #666; margin-bottom: 2px"
                      >{{device.search_date_end}}</label
                    >
                    <input
                      id="device_list-end_time"
                      type="date"
                      style="
                        padding: 6px 8px;
                        border: 1px solid #ddd;
                        border-radius: 4px;
                        font-size: 14px;
                        height: 38px;
                        box-sizing: border-box;
                      "
                      title="選擇結束日期"
                    />
                  </div>
                  <button
                    id="device_list-button-date_search"
                    style="
                      margin-left: 8px;
                      height: 38px;
                      padding: 0 12px;
                      border-radius: 10px;
                      border: 1px solid #ddd;
                      background: #fff;
                      cursor: pointer;
                    "
                  >
                    {{device.search_confirm}}
                  </button>
                  <div class="search-box" style="height: 38px">
                    <button
                      id="device_list-button-search"
                      class="image_button_default"
                      style="display: none"
                    >
                      {{common.search}}
                    </button>
                    <svg
                      class="search-box-icon"
                      fill="currentColor"
                      viewBox="0 0 20 20"
                    >
                      <path
                        fill-rule="evenodd"
                        d="M13.293 14.707a8 8 0 111.414-1.414l4.586 4.586a1 1 0 01-1.414 1.414l-4.586-4.586zM8 14a6 6 0 100-12 6 6 0 000 12z"
                        clip-rule="evenodd"
                      />
                    </svg>
                    <input
                      type="search"
                      placeholder="Search"
                      class="search-box-input"
                      id="device-search-input"
                      autocomplete="off"
                      name="device_search_random_field"
                      readonly
                      onfocus="this.removeAttribute('readonly')"
                    />
                  </div>
                </div>
              </div>
              <div>
                <table class="frame-table">
                  <tr style="display: none">
                    <td colspan="6"></td>
                    <td>
                      <select id="device_list-input_search_field">
                        <option value="2" selected></option>
                      </select>
                    </td>
                    <td>
                      <input id="device_list-input_search_value" />
                    </td>
                  </tr>
                  <tr>
                    <td colspan="12">
                      <div class="viewpoint-container">
                        <table
                          id="device_list-list_information"
                          class="responstable"
                        >
                          <thead>
                            <tr>
                              <th style="width: 5%"></th>
                              <th
                                style="padding: 1rem; cursor: pointer"
                                onclick="sortDeviceTable('create_time')"
                              >
                                {{common.create_time}}
                                <img
                                  id="sort-create_time"
                                  src="assets/images/sort_up.svg"
                                  alt=""
                                  style="
                                    width: 1rem;
                                    height: 1rem;
                                    margin-left: 5px;
                                    transition: transform 0.2s ease;
                                    opacity: 0.5;
                                  "
                                />
                              </th>
                              <th
                                style="padding: 1rem; cursor: pointer"
                                onclick="sortDeviceTable('spec04')"
                              >
                                {{device.spec04}}
                                <img
                                  id="sort-spec04"
                                  src="assets/images/sort_up.svg"
                                  alt=""
                                  style="
                                    width: 1rem;
                                    height: 1rem;
                                    margin-left: 5px;
                                    transition: transform 0.2s ease;
                                    opacity: 0.5;
                                  "
                                />
                              </th>
                              <th
                                style="padding: 1rem; cursor: pointer"
                                onclick="sortDeviceTable('device_cid')"
                              >
                                {{device.device_cid}}
                                <img
                                  id="sort-device_cid"
                                  src="assets/images/sort_up.svg"
                                  alt=""
                                  style="
                                    width: 1rem;
                                    height: 1rem;
                                    margin-left: 5px;
                                    transition: transform 0.2s ease;
                                    opacity: 0.5;
                                  "
                                />
                              </th>
                              <th
                                style="padding: 1rem; cursor: pointer"
                                onclick="sortDeviceTable('license_key')"
                              >
                                {{common.license_Key}}
                                <img
                                  id="sort-license_key"
                                  src="assets/images/sort_up.svg"
                                  alt=""
                                  style="
                                    width: 1rem;
                                    height: 1rem;
                                    margin-left: 5px;
                                    transition: transform 0.2s ease;
                                    opacity: 0.5;
                                  "
                                />
                              </th>
                            </tr>
                          </thead>
                        </table>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="12" style="padding: 1rem">
                      <div
                        id="device_list-list_pagination"
                        class="centered-content"
                      ></div>
                    </td>
                  </tr>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="components/distributor/navbar.js"></script>
    <script src="components/distributor/sidebar.js"></script>

    <!-- Distributor Profile Modal Component -->
    <script type="text/javascript" src="modules/app.module.profile.js"></script>
    <script
      type="text/javascript"
      src="components/app.component.distributor-profile.modal.js"
    ></script>

    <script src="views/app.view.distributor.license.js"></script>
  </body>
</html>
