<!--
    頁面架構會分為 選單 與 內容兩部分
    內容會再依照頁面去選擇不同的功能頁面
-->
<!doctype html>
<html>
  <head>
    <title>CsX Front 123</title>
    <link rel="icon" href="assets/images/favicon.ico" />
    <script src="modules/app.module.def.js"></script>
    <script type="text/javascript" src="locales/app.locale.js"></script>
    <script type="text/javascript" src="modules/app.module.profile.js"></script>

    <!-- 使用sidebar 的樣式-->
    <!-- <link rel="stylesheet" href="components/app.component.frame.sidebar-nav.css"> -->
    <style>
      /* 調淺 Placeholder 顏色 */
      input::placeholder,
      textarea::placeholder {
        color: #d1d5db !important;
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <!-- [新增] 靜態 Loading 元素，JS 載入前就會顯示 -->
    <div id="initial-loader">
      <div class="scan">
        <img
          src="assets/images/Group (3).svg"
          alt="Loading..."
          onerror="this.style.display = 'none'"
        />
        <div class="fingerprint">
          <span class="loading-text">Loading...</span>
        </div>
      </div>
    </div>

    <!-- 擺放 navbar 的容器 -->

    <div id="app" style="visibility: hidden; flex-direction: column">
      <div id="navbar-distributor-container"></div>
      <!-- 擺放sideber 的位置 -->
      <div style="display: flex; height: calc(100vh - 72px)">
        <div id="sidebar-distributor-container"></div>
        <div style="display: flex; flex-direction: column; flex: 1">
          <div id="nav-container"></div>
          <!-- /////////////////////////////////////////////////////////////////////-->
          <!-- 實際內容-->
          <div class="content" style="flex: 1; overflow-y: auto">
            <!-- _________________________________________________________________-->
            <!-- 第一頁個人編輯-->
            <div class="page" id="page01">
              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <div
                  style="
                    width: 800px;
                    max-width: 90vw;
                    height: auto;
                    background: #fff;
                    border-radius: 15px;
                    padding: 32px;
                    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
                  "
                >
                  <!-- 標題列 -->
                  <div
                    style="
                      display: flex;
                      align-items: center;
                      justify-content: space-between;
                      margin-bottom: 12px;
                    "
                  >
                    <div style="display: flex; align-items: center; gap: 12px">
                      <img src="assets/images/account_icon.svg" alt="" />
                      <h1 style="font-size: 24px; font-weight: 600; margin: 0">
                        {{profile.title_update_profile}}
                      </h1>
                    </div>
                    <img
                      src="assets/images/X.svg"
                      alt=""
                      style="cursor: pointer"
                      onclick="
                        window.location.href = 'distributor_dashboard.html'
                      "
                    />
                  </div>

                  <!-- 表單欄位 -->
                  <div
                    style="
                      display: grid;
                      grid-template-columns: repeat(6, minmax(0, 1fr));
                      gap: 20px;
                      margin-top: 12px;
                    "
                  >
                    <!-- 用戶名稱 -->
                    <div style="grid-column: span 3">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-member_cid"
                      >
                        {{member.member_cid}}
                      </label>
                      <input
                        id="profile_update-member_cid"
                        type="text"
                        name="profile_update-member_cid"
                        placeholder="{{member.member_cid_hint}}"
                        value=""
                        disabled
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          height: 38px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>

                    <!-- 電子郵件 -->
                    <div style="grid-column: span 3">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-email"
                      >
                        {{member.email}}
                      </label>
                      <input
                        id="profile_update-email"
                        type="email"
                        name="profile_update-email"
                        placeholder="{{member.email_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          height: 38px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>

                    <!-- 姓名 -->
                    <div style="grid-column: span 3">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-member_name"
                      >
                        {{member.member_name}}
                      </label>
                      <input
                        id="profile_update-member_name"
                        type="text"
                        name="profile_update-member_name"
                        placeholder="{{member.member_name_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          height: 38px;
                          outline: none;
                        "
                      />
                    </div>

                    <div style="grid-column: span 3"></div>
                    <!-- 原密碼 -->
                    <div style="grid-column: span 3; position: relative">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-password"
                      >
                        原密碼
                      </label>
                      <input
                        id="profile_update-password"
                        type="password"
                        name="profile_update-password"
                        placeholder="{{member.password_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          height: 38px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                      <span
                        id="profile-old-password-toggle"
                        style="
                          position: absolute;
                          right: 15px;
                          top: 55%;
                          transform: translateY(-10%);
                          cursor: pointer;
                        "
                        ><img
                          id="profile-old-password-icon"
                          src="assets/images/passwordeyeclose.svg"
                          alt=""
                      /></span>
                    </div>

                    <div style="grid-column: span 3"></div>
                    <div style="grid-column: span 6">
                      <span style="color: rgba(0, 0, 0, 1); font-size: 16px"
                        >變更新密碼</span
                      >
                    </div>
                    <!-- 新密碼 -->
                    <div style="grid-column: span 3; position: relative">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-new_password"
                      >
                        輸入新密碼
                      </label>
                      <input
                        id="profile_update-new_password"
                        type="password"
                        name="profile_update-new_password"
                        placeholder="{{member.new_password_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          height: 38px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                      <span
                        id="profile-new-password-toggle"
                        style="
                          position: absolute;
                          right: 15px;
                          top: 55%;
                          transform: translateY(-10%);
                          cursor: pointer;
                        "
                        ><img
                          id="profile-new-password-icon"
                          src="assets/images/passwordeyeclose.svg"
                          alt=""
                      /></span>
                    </div>

                    <!-- 確認新密碼 -->
                    <div style="grid-column: span 3; position: relative">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-confirm_password"
                      >
                        確認新密碼
                      </label>
                      <input
                        id="profile_update-confirm_password"
                        type="password"
                        name="profile_update-confirm_password"
                        placeholder="{{member.new_password_comfirm_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          height: 38px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                      <span
                        id="profile-confirm-password-toggle"
                        style="
                          position: absolute;
                          right: 15px;
                          top: 55%;
                          transform: translateY(-10%);
                          cursor: pointer;
                        "
                        ><img
                          id="profile-confirm-password-icon"
                          src="assets/images/passwordeyeclose.svg"
                          alt=""
                      /></span>
                    </div>

                    <!-- 性別 -->
                    <div style="grid-column: span 2; display: none">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-gender"
                      >
                        {{member.gender}}
                      </label>
                      <input
                        id="profile_update-gender"
                        type="text"
                        name="profile_update-gender"
                        placeholder="{{member.gender_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>

                    <!-- 記錄狀態 -->
                    <div style="grid-column: span 2; display: none">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-record_state"
                      >
                        {{member.record_state}}
                      </label>
                      <select
                        id="profile_update-record_state"
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      >
                        <option value="1">{{common.open}}</option>
                        <option value="0">{{common.close}}</option>
                      </select>
                    </div>

                    <!-- 生日 -->
                    <div style="grid-column: span 3; display: none">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-birthday"
                      >
                        {{member.birthday}}
                      </label>
                      <input
                        id="profile_update-birthday"
                        type="date"
                        name="profile_update-birthday"
                        value="{{common.empty_date}}"
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>

                    <!-- 電子信箱 -->

                    <!-- 手機 -->
                    <div style="grid-column: span 2; display: none">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-phone_cell"
                      >
                        {{member.phone_cell}}
                      </label>
                      <input
                        id="profile_update-phone_cell"
                        type="tel"
                        name="profile_update-phone_cell"
                        placeholder="{{member.member_phone_cell_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>

                    <!-- 家用電話 -->
                    <div style="grid-column: span 2; display: none">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-phone_home"
                      >
                        {{member.phone_home}}
                      </label>
                      <input
                        id="profile_update-phone_home"
                        type="tel"
                        name="profile_update-phone_home"
                        placeholder="{{member.member_phone_home_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>

                    <!-- 工作電話 -->
                    <div style="grid-column: span 2; display: none">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-phone_work"
                      >
                        {{member.phone_work}}
                      </label>
                      <input
                        id="profile_update-phone_work"
                        type="tel"
                        name="profile_update-phone_work"
                        placeholder="{{member.phone_work_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>

                    <!-- 組織名稱 -->
                    <div style="grid-column: span 2; display: none">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-group_name"
                      >
                        {{member.group_name}}
                      </label>
                      <input
                        id="profile_update-group_name"
                        type="text"
                        name="profile_update-group_name"
                        placeholder="{{member.group_name_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>

                    <!-- 國家 -->
                    <div style="grid-column: span 2; display: none">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-country"
                      >
                        {{member.country}}
                      </label>
                      <input
                        id="profile_update-country"
                        type="text"
                        name="profile_update-country"
                        placeholder="{{member.country}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>

                    <!-- 城市 -->
                    <div style="grid-column: span 2; display: none">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-city"
                      >
                        {{member.city}}
                      </label>
                      <input
                        id="profile_update-city"
                        type="text"
                        name="profile_update-city"
                        placeholder="{{member.city_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>

                    <!-- 地址 -->
                    <div style="grid-column: span 6; display: none">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-address"
                      >
                        {{member.address}}
                      </label>
                      <input
                        id="profile_update-address"
                        type="text"
                        name="profile_update-address"
                        placeholder="{{member.address_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>

                    <!-- 備註 -->
                    <div style="grid-column: span 6; display: none">
                      <label
                        style="
                          display: block;
                          font-size: 14px;
                          font-weight: 500;
                          color: #898c94;
                          margin-bottom: 8px;
                        "
                        for="profile_update-note00"
                      >
                        {{member.note00}}
                      </label>
                      <input
                        id="profile_update-note00"
                        type="text"
                        name="profile_update-note00"
                        placeholder="{{member.note00_hint}}"
                        value=""
                        style="
                          width: 100%;
                          box-sizing: border-box;
                          border: 1px solid #e5e8ea;
                          border-radius: 6px;
                          padding: 6px 12px;
                          font-size: 14px;
                          color: #000;
                          outline: none;
                        "
                      />
                    </div>
                  </div>

                  <!-- 按鈕 -->
                  <div
                    style="
                      display: flex;
                      justify-content: flex-end;
                      margin-top: 28px;
                      gap: 20px;
                    "
                  >
                    <button
                      type="button"
                      onclick="
                        window.location.href = 'distributor_dashboard.html'
                      "
                      style="
                        font-size: 14px;
                        border-radius: 10px;
                        cursor: pointer;
                        border: 1px solid #e5e8ea;
                        background: #fff;
                        color: #898c94;
                        width: 130px;
                        height: 48px;
                      "
                    >
                      取消
                    </button>
                    <button
                      id="profile_update-button-ok"
                      type="submit"
                      style="
                        font-size: 14px;
                        border-radius: 10px;
                        cursor: pointer;
                        border: 1px solid #e5e8ea;
                        background: #214f7c;
                        color: #fff;
                        width: 130px;
                        height: 48px;
                      "
                    >
                      {{common.ok}}
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- _________________________________________________________________-->
          </div>
        </div>
      </div>
      <!-- /////////////////////////////////////////////////////////////////////-->
    </div>

    <!-- 使用nav -->
    <!-- <script
      type="text/javascript"
      src="components/app.component.frame.nav.js"
    ></script> -->
    <!-- _________________________________________________________________-->
    <!-- 使用 navbar -->
    <script
      type="text/javascript"
      src="components/distributor/sidebar.js"
    ></script>

    <!-- 使用sidebar 的樣式-->
    <script
      type="text/javascript"
      src="components/distributor/navbar.js"
    ></script>

    <!-- 請把 view 的相關 js放最前面 以免render後導致監聽事件失效-->
    <script type="text/javascript" src="views/app.view.profile.js"></script>
  </body>
</html>
