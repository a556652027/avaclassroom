<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新增帳號</title>
    <link rel="stylesheet" href="app.component.frame.add-count.css" />
  </head>
  <body>
    <div class="container">
      <form action="" class="form-box">
        <!-- 標題列 -->
        <div class="form-header">
          <div class="header-left">
            <img src="assets/images/add new_button.svg" alt="" />
            <h1>新增帳號</h1>
          </div>
          <img src="assets/images/X.svg" class="close-btn" alt="" />
        </div>
        
        <!-- 表單欄位 -->
        <div class="form-grid">
          <!-- 用戶名稱 -->
          <div class="form-field">
            <label>用戶名稱</label>
            <input type="text" placeholder="請輸入您的用戶名稱" />
          </div>

          <!-- 電子信箱 -->
          <div class="form-field">
            <label>電子信箱</label>
            <input type="text" placeholder="請輸入您的電子郵件" />
          </div>

          <!-- 輸入密碼 -->
          <div class="form-field password-toggle">
            <label>輸入密碼</label>
            <div class="input-wrapper">
              <input
                type="password"
                class="password-input"
                placeholder="請輸入您的密碼"
              />
              <span class="toggle-eye">
                <img
                  src="assets/images/passwordeyeclose.svg"
                  alt="顯示/隱藏密碼"
                  class="eye-icon"
                />
              </span>
            </div>
          </div>

          <!-- 再次輸入密碼 -->
          <div class="form-field password-toggle">
            <label>再次輸入密碼</label>
            <div class="input-wrapper">
              <input
                type="password"
                class="password-input"
                placeholder="請再次輸入密碼"
              />
              <span class="toggle-eye">
                <img
                  src="assets/images/passwordeyeclose.svg"
                  alt="顯示/隱藏密碼"
                  class="eye-icon"
                />
              </span>
            </div>
          </div>
        </div>

        <!-- 按鈕 -->
        <div class="form-actions">
          <button type="button" class="btn cancel">取消</button>
          <button type="submit" class="btn save">新增並寄送郵件給用戶</button>
        </div>
      </form>
    </div>

  </body>
</html>
