<!-- 組織編輯彈窗 -->
<div
  id="organization-edit-modal"
  style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  "
>
  <div
    style="
      background-color: #ffffff;
      box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      padding: 30px;
      width: 90%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
    "
  >
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      "
    >
      <div style="display: flex; align-items: center">
        <img
          src="assets/images/editcompany.png"
          alt=""
          style="margin-right: 1rem; width: 30px"
        />
        <h2
          style="
            font-family: Inter;
            font-weight: 900;
            font-size: 24px;
            line-height: 125%;
            letter-spacing: 5%;
            vertical-align: middle;
            margin: 0;
          "
        >
          {{sidebarnav.organization}}
        </h2>
      </div>
      <img
        src="assets/images/X.svg"
        alt=""
        style="cursor: pointer"
        onclick="closeOrganizationEditModal()"
      />
    </div>

    <form id="organization-edit-form">
      <div
        style="display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 1rem"
      >
        <div style="display: flex; flex-direction: column; width: 230px">
          <label
            for="org-edit-country"
            style="color: #898c94; margin-bottom: 0.5rem"
            >{{organization.country}}</label
          >
          <select
            id="org-edit-country"
            name="country"
            style="
              border: 1px solid #e5e8ea;
              outline: none;
              height: 38px;
              padding: 8px;
              border-radius: 10px;
              background-color: #ffffff;
              box-shadow: none;
              width: 230px;
            "
            required
          >
            <option value="">{{organization.select_country}}</option>
            <option value="Taiwan">Taiwan</option>
            <option value="China">China</option>
            <option value="Japan">Japan</option>
            <option value="India">India</option>
            <option value="Thailand">Thailand</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; width: 230px">
          <label
            for="org-edit-group_name"
            style="color: #898c94; margin-bottom: 0.5rem"
            >{{organization.group_name}}</label
          >
          <input
            id="org-edit-group_name"
            type="text"
            name="group_name"
            placeholder="{{organization.group_name_hint}}"
            style="
              border: 1px solid #e5e8ea;
              outline: none;
              height: 38px;
              padding: 8px;
              border-radius: 10px;
            "
            required
          />
        </div>
        <div style="display: none; flex-direction: column; width: 230px">
          <label
            for="org-edit-group_type"
            style="color: #898c94; margin-bottom: 0.5rem"
            >{{organization.group_type}}</label
          >
          <input
            id="org-edit-group_type"
            type="text"
            name="group_type"
            placeholder="{{organization.group_type}}..."
            style="
              border: 1px solid #e5e8ea;
              outline: none;
              height: 38px;
              padding: 8px;
              border-radius: 10px;
            "
            required
          />
        </div>
      </div>

      <div
        style="display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 1rem"
      >
        <div style="display: flex; flex-direction: column; width: 230px">
          <label
            for="org-edit-group_cid"
            style="color: #898c94; margin-bottom: 0.5rem"
            >{{organization.group_cid}}</label
          >
          <input
            id="org-edit-group_cid"
            type="text"
            name="group_cid"
            placeholder="{{organization.group_cid_hint}}"
            style="
              border: 1px solid #e5e8ea;
              outline: none;
              height: 38px;
              padding: 8px;
              border-radius: 10px;
              background-color: #f5f5f5;
            "
            readonly
          />
        </div>
        <div style="display: flex; flex-direction: column; width: 230px">
          <label
            for="org-edit-group_ubn"
            style="color: #898c94; margin-bottom: 0.5rem"
            >{{organization.group_ubn}}</label
          >
          <input
            id="org-edit-group_ubn"
            type="text"
            name="group_ubn"
            placeholder="{{organization.group_ubn}}..."
            style="
              border: 1px solid #e5e8ea;
              outline: none;
              height: 38px;
              padding: 8px;
              border-radius: 10px;
            "
            required
          />
        </div>
        <div style="display: flex; flex-direction: column; width: 230px">
          <label
            for="org-edit-contact"
            style="color: #898c94; margin-bottom: 0.5rem"
            >{{organization.contact}}</label
          >
          <input
            id="org-edit-contact"
            type="text"
            name="contact"
            placeholder="{{organization.contact}}..."
            style="
              border: 1px solid #e5e8ea;
              outline: none;
              height: 38px;
              padding: 8px;
              border-radius: 10px;
            "
            required
          />
        </div>
      </div>

      <div
        style="display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 1rem"
      >
        <div style="display: flex; flex-direction: column; width: 358px">
          <label
            for="org-edit-contact_phone_01"
            style="color: #898c94; margin-bottom: 0.5rem"
            >{{organization.contact_phone_01}}</label
          >
          <input
            id="org-edit-contact_phone_01"
            type="text"
            name="contact_phone_01"
            placeholder="{{organization.contact_phone_01}}..."
            style="
              border: 1px solid #e5e8ea;
              outline: none;
              height: 38px;
              padding: 8px;
              border-radius: 10px;
            "
            required
          />
        </div>
        <div style="display: flex; flex-direction: column; width: 358px">
          <label
            for="org-edit-contact_email_01"
            style="color: #898c94; margin-bottom: 0.5rem"
            >{{organization.contact_email_01}}</label
          >
          <input
            id="org-edit-contact_email_01"
            type="email"
            name="contact_email_01"
            placeholder="{{organization.contact_email_01}}..."
            style="
              border: 1px solid #e5e8ea;
              outline: none;
              height: 38px;
              padding: 8px;
              border-radius: 10px;
            "
            required
          />
        </div>
      </div>

      <div
        style="display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 1rem"
      >
        <div style="display: flex; flex-direction: column; width: 358px">
          <label
            for="org-edit-address"
            style="color: #898c94; margin-bottom: 0.5rem"
            >{{organization.address}}</label
          >
          <input
            id="org-edit-address"
            type="text"
            name="address"
            placeholder="{{organization.address}}..."
            style="
              border: 1px solid #e5e8ea;
              outline: none;
              height: 38px;
              padding: 8px;
              border-radius: 10px;
            "
            required
          />
        </div>
        <div style="display: flex; flex-direction: column; width: 358px">
          <label
            for="org-edit-billing_addr"
            style="color: #898c94; margin-bottom: 0.5rem"
            >{{organization.billing_addr}}</label
          >
          <input
            id="org-edit-billing_addr"
            type="text"
            name="billing_addr"
            placeholder="{{organization.billing_addr}}..."
            style="
              border: 1px solid #e5e8ea;
              outline: none;
              height: 38px;
              padding: 8px;
              border-radius: 10px;
            "
            required
          />
        </div>
      </div>

      <!-- 隐藏字段：用于存储从数据库获取的数据 -->
      <input type="hidden" id="org-edit-owner_cid" name="owner_cid" />
      <input type="hidden" id="org-edit-city" name="city" />

      <div style="display: flex; flex-direction: column; margin-bottom: 1rem">
        <label
          for="org-edit-note00"
          style="color: #898c94; margin-bottom: 0.5rem"
          >{{common.note00}}</label
        >
        <textarea
          id="org-edit-note00"
          name="note00"
          placeholder="{{common.note00}}..."
          style="
            border: 1px solid #e5e8ea;
            outline: none;
            padding: 8px;
            height: 80px;
            resize: vertical;
            border-radius: 6px;
          "
        ></textarea>
      </div>

      <div
        style="
          display: flex;
          flex-wrap: wrap;
          justify-content: space-between;
          gap: 1rem;
        "
      >
        <button
          type="button"
          id="org-edit-delete-btn"
          style="
            width: 130px;
            height: 48px;
            background-color: #ffffff;
            border: 1px solid #de6565;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #de6565;
            transition: all 0.3s ease;
          "
          onmouseover="
            this.style.backgroundColor = '#DE6565';
            this.style.color = '#ffffff';
          "
          onmouseout="
            this.style.backgroundColor = '#ffffff';
            this.style.color = '#DE6565';
          "
        >
          {{common.delete}}
        </button>
        <div style="display: flex; justify-content: flex-end; gap: 1rem">
          <button
            type="button"
            onclick="closeOrganizationEditModal()"
            style="
              width: 130px;
              height: 48px;
              background-color: #ffffff;
              border: 1px solid #e5e8ea;
              border-radius: 10px;
              cursor: pointer;
              font-size: 14px;
            "
            onmouseover="
              this.style.backgroundColor = '#E5E8EA';
              this.style.color = '#404040';
            "
            onmouseout="
              this.style.backgroundColor = '#ffffff';
              this.style.color = '';
            "
          >
            {{common.cancel}}
          </button>
          <button
            type="submit"
            style="
              width: 130px;
              height: 48px;
              background-color: #214f7c;
              border-radius: 10px;
              border: none;
              color: #ffffff;
              cursor: pointer;
              font-size: 14px;
            "
            onmouseover="
              this.style.backgroundColor = '#EE963F';
              this.style.color = '#FFFFFF';
            "
            onmouseout="
              this.style.backgroundColor = '#214f7c';
              this.style.color = '#FFFFFF';
            "
          >
            {{common.save}}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
