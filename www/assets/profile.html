<!--
    頁面架構會分為 選單 與 內容兩部分
    內容會再依照頁面去選擇不同的功能頁面
-->
<!DOCTYPE html>
<html>
    <head>
        <title>CsX Front Template</title>
        <script src="modules/app.module.def.js"></script>
        <script type="text/javascript" src="locales/app.locale.js"></script>
        <script type="text/javascript" src="modules/app.module.profile.js"></script>

        <!-- 使用sidebar 的樣式-->
        <!-- <link rel="stylesheet" href="components/app.component.frame.sidebar-nav.css"> -->
    </head>

    <body>
        <div id="app" style="visibility: hidden">
            <!-- 擺放sideber 的位置 -->
            <div id="sidebar-nav-container"></div>

            <!-- /////////////////////////////////////////////////////////////////////-->
            <!-- 實際內容-->
            <div class="content">
                <!-- _________________________________________________________________-->
                <!-- 第一頁個人編輯-->
                <div data-role="page" id="page01">
                    <div class="page-caption">
                        <h1>{{profile.title_update_profile}}</h1>
                    </div>
                    <div>
                        <table class="frame-table">
                            <tr>
                                <td colspan="6"></td>
                                <!-- 間隔用的 td -->
                                <td colspan="4"></td>
                                <!-- 間隔用的 td -->
                                <td colspan="1"></td>
                                <td colspan="1">
                                    <button id="profile_update-button-ok" class="image_button_default">
                                        <i class="iconfont">&#xe786;&nbsp;</i>
                                        {{common.ok}}
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="1">{{test.anchor}}</td>
                                <td colspan="1">{{test.anchor}}</td>
                                <td colspan="1">{{test.anchor}}</td>
                                <td colspan="1">{{test.anchor}}</td>
                                <td colspan="1">{{test.anchor}}</td>
                                <td colspan="1">{{test.anchor}}</td>
                                <td colspan="1">{{test.anchor}}</td>
                                <td colspan="1">{{test.anchor}}</td>
                                <td colspan="1">{{test.anchor}}</td>
                                <td colspan="1">{{test.anchor}}</td>
                                <td colspan="1">{{test.anchor}}</td>
                                <td colspan="1">{{test.anchor}}</td>
                            </tr>
                            <tr>
                                <td colspan="6">
                                    <label class="label-style-default" for="profile_update-member_cid">{{member.member_cid}}</label>
                                    <input id="profile_update-member_cid" type="text" name="profile_update-member_cid" placeholder="{{member.member_cid}}..." value="" required disabled />
                                </td>
                                <td colspan="6">
                                    <label class="label-style-default" for="profile_update-password">{{member.password}}</label>
                                    <input id="profile_update-password" type="password" name="profile_update-password" placeholder="{{member.password}}..." value="" required />
                                </td>
                            </tr>
                            <tr>
                                <td colspan="4">
                                    <label class="label-style-default" for="profile_update-member_name">{{member.member_name}}</label>
                                    <input id="profile_update-member_name" type="text" name="profile_update-member_name" placeholder="{{member.member_name}}..." value="" required />
                                </td>
                                <td colspan="4">
                                    <label class="label-style-default" for="profile_update-gender">{{member.gender}}</label>
                                    <input id="profile_update-gender" type="text" name="profile_update-gender" placeholder="{{member.gender}}..." value="" required />
                                </td>
                                <td colspan="4">
                                    <label class="label-style-default" for="profile_update-record_state">{{member.record_state}}</label>
                                    <div class="styled-select blue rounded">
                                        <select id="profile_update-record_state" data-role="none">
                                            <option value="1">{{common.open}}</option>
                                            <option value="0">{{common.close}}</option>
                                        </select>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="6">
                                    <label class="label-style-default" for="profile_update-birthday">{{member.birthday}}</label>
                                    <input id="profile_update-birthday" type="date" name="profile_update-birthday" placeholder="{{member.birthday}}..." value="{{common.empty_date}}" required />
                                </td>
                                <td colspan="6">
                                    <label class="label-style-default" for="profile_update-email">{{member.email}}</label>
                                    <input id="profile_update-email" type="email" name="profile_update-email" placeholder="{{member.email}}..." value="" required />
                                </td>
                            </tr>
                            <tr>
                                <td colspan="4">
                                    <label class="label-style-default" for="profile_update-phone_cell">{{member.phone_cell}}</label>
                                    <input id="profile_update-phone_cell" type="tel" name="profile_update-phone_cell" placeholder="{{member.member_phone_cell}}..." value="" required />
                                </td>
                                <td colspan="4">
                                    <label class="label-style-default" for="profile_update-phone_home">{{member.phone_home}}</label>
                                    <input id="profile_update-phone_home" type="tel" name="profile_update-phone_home" placeholder="{{member.member_phone_home}}..." value="" required />
                                </td>
                                <td colspan="4">
                                    <label class="label-style-default" for="profile_update-phone_work">{{member.phone_work}}</label>
                                    <input id="profile_update-phone_work" type="tel" name="profile_update-phone_work" placeholder="{{member.phone_work}}..." value="" required />
                                </td>
                            </tr>
                            <tr>
                                <td colspan="4">
                                    <label class="label-style-default" for="profile_update-group_name">{{member.group_name}}</label>
                                    <input id="profile_update-group_name" type="text" name="profile_update-group_name" placeholder="{{member.group_name}}..." value="{{test.test_srting_00}}" required />
                                </td>
                                <td colspan="4">
                                    <label class="label-style-default" for="profile_update-country">{{member.country}}</label>
                                    <input id="profile_update-country" type="text" name="profile_update-country" placeholder="{{member.country}}..." value="" required />
                                </td>
                                <td colspan="4">
                                    <label class="label-style-default" for="profile_update-city">{{member.city}}</label>
                                    <input id="profile_update-city" type="text" name="profile_update-city" placeholder="{{member.city}}..." value="" required />
                                </td>
                            </tr>
                            <tr>
                                <td colspan="12">
                                    <label class="label-style-default" for="profile_update-address">{{member.address}}</label>
                                    <input id="profile_update-address" type="text" name="profile_update-address" placeholder="{{member.address}}..." value="" required />
                                </td>
                            </tr>
                            <tr>
                                <td colspan="12">
                                    <label for="profile_update-note00">{{member.note00}}</label>
                                    <input id="profile_update-note00" type="text" name="profile_update-note00" placeholder="{{member.note00}}..." value="{{test.test_srting_00}}" required />
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>

                <!-- _________________________________________________________________-->
            </div>
            <!-- /////////////////////////////////////////////////////////////////////-->
        </div>

        <!-- _________________________________________________________________-->
        <!-- 使用sidebar 的樣式-->
        <script type="text/javascript" src="components/app.component.frame.sidebar-nav.js"></script>

        <!-- 請把 view 的相關 js放最前面 以免render後導致監聽事件失效-->
        <script type="text/javascript" src="views/app.view.profile.js"></script>
    </body>
</html>
