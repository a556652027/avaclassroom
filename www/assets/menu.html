<!DOCTYPE html>
<html>
    <head>
        <title>RWD 選單範例</title>
        <style>
            /* CSS 樣式 */
            body {
                font-family: sans-serif;
                display: flex;
            }

            #app {
                display: flex;
                width: 100%;
                height: 100vh;
                visibility: visible;
            }

            .sidebar-nav {
                width: 200px;
                background-color: #f0f0f0;
                padding: 10px;
                position: relative;
                top: 0;
                left: 0;
                height: 100%;
                overflow-y: auto;
                display: block;
                transition: left 0.3s ease-in-out;
                z-index: 1001;
            }

            .menu {
                list-style: none;
                padding: 0;
            }

            .menu li {
                margin-bottom: 5px;
            }

            .menu a {
                display: block;
                padding: 8px;
                text-decoration: none;
                color: #333;
            }

            .menu a:hover {
                background-color: #ddd;
            }

            .submenu {
                display: none;
                list-style: none;
                padding-left: 20px;
            }

            .menu a.has-submenu:hover + .submenu,
            .submenu:hover {
                display: block;
            }

            #toggle-btn {
                display: none;
                padding: 10px;
                background-color: #ddd;
                border: none;
                cursor: pointer;
                z-index: 1;
                position: fixed;
                top: 10px;
                left: 10px;
            }

            #hamburger-icon {
                width: 30px;
                height: 20px;
                position: relative;
                cursor: pointer;
            }

            #hamburger-icon span {
                display: block;
                position: absolute;
                width: 100%;
                height: 2px;
                background-color: #333;
                border-radius: 2px;
                transition: 0.25s ease-in-out;
            }

            #hamburger-icon span:nth-child(1) {
                top: 0px;
            }

            #hamburger-icon span:nth-child(2) {
                top: 8px;
            }

            #hamburger-icon span:nth-child(3) {
                top: 16px;
            }

            #hamburger-icon.active span:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }

            #hamburger-icon.active span:nth-child(2) {
                opacity: 0;
            }

            #hamburger-icon.active span:nth-child(3) {
                transform: rotate(-45deg) translate(5px, -5px);
            }

            .content {
                flex: 1;
                padding: 20px;
                margin-left: 220px;
                transition: margin-left 0.3s ease-in-out;
            }

            @media (max-width: 768px) {
                .sidebar-nav {
                    position: absolute;
                    left: -200px;
                    /* 初始狀態隱藏 */
                    width: 200px;
                    /* 確保寬度一致 */
                }

                .content {
                    margin-left: 0;
                    padding-top: 60px;
                    transition: padding-left 0.3s ease-in-out;
                    /* 加入 transition */
                }

                .content.active {
                    padding-left: 200px;
                }

                #toggle-btn {
                    display: block;
                }

                .sidebar-nav.active {
                    left: 0 !important;
                }
            }
        </style>
    </head>

    <body>
        <div id="app">
            <button id="toggle-btn">
                <div id="hamburger-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </button>

            <div id="sidebar-nav" class="sidebar-nav">
                <ul class="menu">
                    <li><a href="#">首頁</a></li>
                    <li>
                        <a href="#" class="has-submenu">產品管理</a>
                        <ul class="submenu">
                            <li><a href="#">產品列表</a></li>
                            <li><a href="#">新增產品</a></li>
                            <li><a href="#">產品分類</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#" class="has-submenu">會員管理</a>
                        <ul class="submenu">
                            <li><a href="#">會員列表</a></li>
                            <li><a href="#">會員等級</a></li>
                            <li><a href="#">會員權限</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#" class="has-submenu">訂單管理</a>
                        <ul class="submenu">
                            <li><a href="#">訂單列表</a></li>
                            <li><a href="#">訂單查詢</a></li>
                            <li><a href="#">訂單統計</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#" class="has-submenu">系統設定</a>
                        <ul class="submenu">
                            <li><a href="#">基本設定</a></li>
                            <li><a href="#">進階設定</a></li>
                            <li><a href="#">權限管理</a></li>
                        </ul>
                    </li>
                </ul>
            </div>

            <div class="content">
                <h1>歡迎使用後台管理系統</h1>
                <p>這裡顯示主要的頁面內容。</p>
            </div>
        </div>

        <script>
            const sidebarNav = document.getElementById("sidebar-nav");
            const content = document.querySelector(".content");
            const toggleBtn = document.getElementById("toggle-btn");
            const hamburgerIcon = document.getElementById("hamburger-icon");

            toggleBtn.addEventListener("click", () => {
                sidebarNav.classList.toggle("active");
                hamburgerIcon.classList.toggle("active");
                content.classList.toggle("active");
            });

            sidebarNav.addEventListener("click", () => {
                if (sidebarNav.classList.contains("active")) {
                    sidebarNav.classList.remove("active");
                    hamburgerIcon.classList.remove("active");
                    content.classList.remove("active");
                }
            });

            content.addEventListener("click", () => {
                if (sidebarNav.classList.contains("active")) {
                    sidebarNav.classList.remove("active");
                    hamburgerIcon.classList.remove("active");
                    content.classList.remove("active");
                }
            });
        </script>
    </body>
</html>
