<!--
    頁面架構會分為 選單 與 內容兩部分
    內容會再依照頁面去選擇不同的功能頁面
-->
<!DOCTYPE html>
<html>
    <head>
        <title>CsX Front Template</title>
        <script src="modules/app.module.def.js"></script>
        <script type="text/javascript" src="locales/app.locale.js"></script>
        <script type="text/javascript" src="modules/app.module.login.js"></script>

        <!-- 使用sidebar 的樣式-->
        <!-- <link rel="stylesheet" href="components/app.component.frame.sidebar-nav.css"> -->
    </head>

    <body>
        <div id="app" style="visibility: hidden">
            <!-- _________________________________________________________________-->
            <!-- 實際內容-->
            <div class="content">
                <!-- 登入 -->
                <div data-role="page" id="page01">
                    <div>
                        <img src="./assets/images/applogo.png" style="width: 300px; display: block; padding: 20px; margin: 0 auto" />
                    </div>
                    <div role="main" class="ui-content" style="width: 300px; height: 600px; border: 5px; margin: 0 auto">
                        <table class="frame-table">
                            <tr>
                                <td colspan="1">
                                    <label class="label-style-default" for="login_username" class="">{{common.member_cid}}</label>
                                </td>
                                <td colspan="1">
                                    <input id="login_username" type="text" name="member_cid" placeholder="{{common.member_cid}}..." value="" required />
                                </td>
                            </tr>
                            <tr>
                                <td colspan="1">
                                    <label class="label-style-default" for="login_password" class="">{{common.password}}</label>
                                </td>
                                <td colspan="1">
                                    <input id="login_password" type="password" name="password" placeholder="{{common.password}}..." value="" required />
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <button type="submit" id="Login" class="image_button_default" data-role="none">{{login.login_submit}}</button>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label class="label-style-default" for="login-remember_username" class="lablsett">{{login.remember_username}}</label>
                                </td>
                                <td>
                                    <div class="styled-select blue rounded">
                                        <select name="login-remember_username" id="login-remember_username" data-role="flipswitch">
                                            <option value="off">Off</option>
                                            <option value="on">On</option>
                                        </select>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label class="label-style-default" for="flip-6" class="lablsett">{{login.language}}</label>
                                </td>
                                <td>
                                    <div class="styled-select blue rounded">
                                        <select name="flip-6" id="flip-6" data-role="flipswitch">
                                            <option value="lang_zhtw">繁體中文</option>
                                            <option value="lang_enus">English</option>
                                        </select>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <div class="centered-content">
                                        <button id="reset_password" class="centered-content link_text">{{login.forget_password}}</button>
                                    </div>
                                </td>
                            </tr>
                        </table>

                        <!--<button onclick="Login" id="Login" class="ui-btn ui-corner-all ui-shadow ui-btn-icon-left ui-icon-check">登入</button>-->
                    </div>
                </div>

                <!-- 重設密碼 -->
                <div data-role="page" id="page02">
                    <div>
                        <img src="./assets/images/applogo.png" style="width: 300px; display: block; padding: 20px; margin: 0 auto" />
                    </div>
                    <div role="main" class="ui-content" style="width: 300px; height: 600px; border: 5px; margin: 0 auto">
                        <table class="frame-table">
                            <tr>
                                <td colspan="1">
                                    <label class="label-style-default" for="reset_password-username" class="">{{common.member_cid}}</label>
                                </td>
                                <td colspan="1">
                                    <input id="reset_password-username" type="text" name="reset_password-username" placeholder="{{common.member_cid}}..." value="" required />
                                </td>
                            </tr>
                            <tr>
                                <td colspan="1">
                                    <label class="label-style-default" for="reset_password-email" class="">{{common.email}}</label>
                                </td>
                                <td colspan="1">
                                    <input id="reset_password-email" type="text" name="reset_password-email" placeholder="{{common.email}}..." value="" required />
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <button type="submit" id="reset_password-send" class="image_button_default" data-role="none">{{common.send}}</button>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <button type="submit" id="reset_password-cancel" class="image_button_default" data-role="none">{{common.cancel}}</button>
                                </td>
                            </tr>
                        </table>

                        <!--<button onclick="Login" id="Login" class="ui-btn ui-corner-all ui-shadow ui-btn-icon-left ui-icon-check">登入</button>-->
                    </div>
                </div>
            </div>
        </div>

        <!-- 請把 view 的相關 js放最前面 以免render後導致監聽事件失效-->
        <script type="text/javascript" src="views/app.view.login.js"></script>
    </body>
</html>
