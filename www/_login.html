<!--
    頁面架構會分為 選單 與 內容兩部分
    內容會再依照頁面去選擇不同的功能頁面
-->
<!DOCTYPE html>
<html>
  <head>
    <title>License Management System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/images/favicon.ico">

    <script src="modules/app.module.def.js"></script>
    <script type="text/javascript" src="locales/app.locale.js"></script>
    <script type="text/javascript" src="modules/app.module.login.js"></script>

    <!-- 使用sidebar 的樣式-->
    <!-- <link rel="stylesheet" href="components/app.component.frame.sidebar-nav.css"> -->

    <style>
      #login_username::placeholder,
      #login_password::placeholder {
        color: #d1d5db !important;
      }

      #remember_me {
        width: 1rem;
        height: 1rem;
        margin-right: 0.5rem;
        border-radius: 0.125rem;
        appearance: none;
        border: 1px solid #d9dde3;
        cursor: pointer;
      }

      #remember_me:checked {
        background-color: #ee963f;
      }

      #login_username:focus,
      #login_password:focus {
        outline: none;
      }

      #login_username,
      #login_password {
        color: #333 !important;
      }

      #login_username:-webkit-autofill,
      #login_password:-webkit-autofill {
        -webkit-text-fill-color: #333 !important;
        -webkit-box-shadow: 0 0 0px 1000px white inset !important;
      }
      .login-button:hover {
        background-color: #ee963f !important;
        transition: background-color 0.2s ease;
      }
      .login-button {
        transition: background-color 0.2s ease;
      }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const languageToggle = document.getElementById("language-toggle");
        const languageSelector = document.getElementById("language-selector");

        languageToggle.addEventListener("click", function () {
          if (languageSelector.style.display === "none") {
            languageSelector.style.display = "block";
          } else {
            languageSelector.style.display = "none";
          }
        });

        // 語言切換函數
        window.changeLanguage = function (lang) {
          console.log("切換語言到: " + lang);
          // 隱藏選擇器
          languageSelector.style.display = "none";
          
          // 儲存語言設定並重新載入頁面以套用
          window.localStorage.setItem("language", lang);
          window.location.reload();
        };

        // 密碼顯示切換功能
        const passwordToggle = document.getElementById("password-eye-toggle");
        const passwordInput = document.getElementById("login_password");
        const passwordIcon = document.getElementById("password-eye-icon");

        if (passwordToggle && passwordInput && passwordIcon) {
          passwordToggle.addEventListener("click", function () {
            if (passwordInput.type === "password") {
              passwordInput.type = "text";
              passwordIcon.src = "assets/images/passwordeyeopen.svg";
            } else {
              passwordInput.type = "password";
              passwordIcon.src = "assets/images/passwordeyeclose.svg";
            }
          });
        }
      });
    </script>
    <style>
      /* 靜態 Loading 遮罩樣式 */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        z-index: 99999;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        transition: opacity 0.3s ease-out;
      }
      #initial-loader .scan {
        text-align: center;
      }
      #initial-loader img {
        width: 300px;
        height: 300px;
        margin-bottom: 10px;
      }
      #initial-loader .loading-text {
        font-size: 60px;
        color: #92bfff;
        font-family: sans-serif;
        font-weight: bold;
        animation: blink 1.5s infinite;
      }
      @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
      }
    </style>
  </head>

  <body>
    <!-- [新增] 靜態 Loading 元素，JS 載入前就會顯示 -->
    <div id="initial-loader">
      <div class="scan">
        <img src="assets/images/Group (3).svg" alt="Loading..." onerror="this.style.display='none'"/>
        <div class="fingerprint">
          <span class="loading-text">Loading...</span>
        </div>
      </div>
    </div>

    <div id="app" style="visibility: hidden">
      <!-- _________________________________________________________________-->
      <!-- 實際內容-->
      <div
        class="content"
        style="
          background-color: #f1f4f8;
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 5rem;
        "
      >
        <!-- 登入 -->
        <div style="flex-direction: column">
          <div
            style="
              background-color: white;
              width: 600px;
              border-radius: 24px;
              justify-content: center;
              align-items: center;
              display: flex;
            "
          >
            <div data-role="page" id="page01">
              <div>
                <img
                  src="assets/images/empia小-03 1.svg"
                  style="
                    display: block;
                    padding: 20px 0px 10px 0px;
                    margin: 0 auto;
                  "
                />
              </div>
              <div
                role="main"
                class="ui-content"
                style="height: 400px; border: 5px; margin: 0 auto"
              >
                <table
                  class=""
                  style="position: relative; flex-direction: column"
                >
                  <tr style="display: flex; flex-direction: column">
                    <td colspan="1">
                      <label
                        class=""
                        for="login_username"
                        class=""
                        style="
                          color: #898c94;
                          font-size: 14px;
                          box-sizing: border-box;
                        "
                        >{{common.member_cid}}</label
                      >
                    </td>
                    <td colspan="1">
                      <input
                        id="login_username"
                        type="text"
                        name="member_cid"
                        placeholder="{{common.member_cid_input}}"
                        value=""
                        required
                        style="
                          font-size: 14px;
                          width: 464px;
                          border-radius: 23px;
                          padding: 14px;
                          border: 1px solid #d9dde3;
                          margin-top: 5px;
                        "
                      />
                    </td>
                  </tr>
                  <tr style="display: flex; flex-direction: column">
                    <td colspan="1">
                      <label
                        class=""
                        for="login_password"
                        class=""
                        style="
                          color: #898c94;
                          font-size: 14px;
                          margin-top: 10px;
                        "
                        >{{common.password}}</label
                      >
                    </td>
                    <td colspan="1" style="position: relative">
                      <input
                        id="login_password"
                        type="password"
                        name="password"
                        placeholder="{{common.password_input}}"
                        value=""
                        required
                        style="
                          font-size: 14px;
                          width: 464px;
                          border-radius: 23px;
                          padding: 14px;
                          border: 1px solid #d9dde3;
                          margin-top: 5px;
                        "
                      />
                      <span
                        id="password-eye-toggle"
                        style="
                          position: absolute;
                          right: 15px;
                          top: 55%;
                          transform: translateY(-50%);
                          cursor: pointer;
                        "
                        ><img
                          id="password-eye-icon"
                          src="assets/images/passwordeyeclose.svg"
                          alt=""
                      /></span>
                    </td>
                  </tr>
                  <div>
                    <tr>
                      <td
                        colspan="2"
                        style="
                          display: flex;
                          align-items: center;
                          margin-top: 10px;
                        "
                      >
                        <input type="checkbox" id="remember_me" />
                        <label
                          for="remember_me"
                          style="color: #898c94; font-size: 14px; margin: 0"
                          >{{login.remember_username}}</label
                        >
                      </td>
                    </tr>
                  </div>
                  <tr>
                    <td colspan="2">
                      <button
                        type="submit"
                        id="Login"
                        style="
                          width: 100%;
                          background-color: #214f7c;
                          color: white;
                          padding: 0.5rem 0;
                          border-radius: 23px;
                          height: 48px;
                          transition: all 0.2s ease;
                          cursor: pointer;
                          border: none;
                          margin-top: 15px;
                        "
                        class="login-button"
                        data-role="none"
                      >
                        {{login.login_submit}}
                      </button>
                    </td>
                  </tr>
                  <!-- 目前用不到 -->
                  <tr>
                    <td style="display: none">
                      <label
                        class="label-style-default"
                        for="login-remember_username"
                        class="lablsett"
                        >{{login.remember_username}}</label
                      >
                    </td>
                    <td style="display: none">
                      <div class="styled-select blue rounded">
                        <select
                          name="login-remember_username"
                          id="login-remember_username"
                          data-role="flipswitch"
                        >
                          <option value="off">Off</option>
                          <option value="on">On</option>
                        </select>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <div class="">
                        <button
                          id="reset_password"
                          class="centered-content link_text"
                          style="color: #ee963f; margin-top: 15px"
                        >
                          {{login.forget_password}}
                        </button>
                      </div>
                    </td>
                  </tr>
                </table>
              </div>
            </div>

            <!-- 重設密碼區塊 -->
            <div data-role="page" id="page02" style="display: none;">
              <div>
                <img
                  src="assets/images/empia小-03 1.svg"
                  style="
                    display: block;
                    padding: 20px 0px 10px 0px;
                    margin: 0 auto;
                  "
                />
              </div>
              <div
                role="main"
                class="ui-content"
                style="height: 400px; border: 5px; margin: 0 auto"
              >
                <table
                  class=""
                  style="position: relative; flex-direction: column"
                >
                  <tr style="display: flex; flex-direction: column">
                    <td colspan="1">
                      <label
                        style="
                          color: #898c94;
                          font-size: 14px;
                          box-sizing: border-box;
                        "
                        for="reset_password-username"
                        >{{common.member_cid}}</label
                      >
                    </td>
                    <td colspan="1">
                      <input
                        id="reset_password-username"
                        type="text"
                        name="reset_password-username"
                        placeholder="{{common.member_cid}}"
                        value=""
                        required
                        style="
                          font-size: 14px;
                          width: 464px;
                          border-radius: 23px;
                          padding: 14px;
                          border: 1px solid #d9dde3;
                          margin-top: 5px;
                        "
                      />
                    </td>
                  </tr>
                  <tr style="display: flex; flex-direction: column">
                    <td colspan="1">
                      <label
                        style="
                          color: #898c94;
                          font-size: 14px;
                          margin-top: 10px;
                        "
                        for="reset_password-email"
                        >{{common.email}}</label
                      >
                    </td>
                    <td colspan="1">
                      <input
                        id="reset_password-email"
                        type="text"
                        name="reset_password-email"
                        placeholder="{{common.email}}"
                        value=""
                        required
                        style="
                          font-size: 14px;
                          width: 464px;
                          border-radius: 23px;
                          padding: 14px;
                          border: 1px solid #d9dde3;
                          margin-top: 5px;
                        "
                      />
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <button
                        type="submit"
                        id="reset_password-send"
                        style="
                          width: 100%;
                          background-color: #214f7c;
                          color: white;
                          padding: 0.5rem 0;
                          border-radius: 23px;
                          height: 48px;
                          transition: all 0.2s ease;
                          cursor: pointer;
                          border: none;
                          margin-top: 25px;
                        "
                        class="login-button"
                        data-role="none"
                      >
                        {{common.send}}
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <button
                        type="button"
                        id="reset_password-cancel"
                        style="
                          width: 100%;
                          background-color: #ffffff;
                          color: #898c94;
                          padding: 0.5rem 0;
                          border-radius: 23px;
                          height: 48px;
                          transition: all 0.2s ease;
                          cursor: pointer;
                          border: 1px solid #d9dde3;
                          margin-top: 10px;
                        "
                        data-role="none"
                      >
                        {{common.cancel}}
                      </button>
                    </td>
                  </tr>
                </table>
              </div>
            </div>
          </div>
          <div
            style="
              cursor: pointer;
              display: flex;
              position: relative;
              margin-top: 15px;
            "
          >
            <img src="assets/images/Default.svg" alt="" id="language-toggle" />
            <div
              id="language-selector"
              style="
                display: none;
                position: absolute;
                left: 60px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                z-index: 1000;
                min-width: 120px;
              "
            >
              <button
                onclick="changeLanguage('zh-tw')"
                style="
                  display: block;
                  width: 100%;
                  padding: 8px 16px;
                  margin-bottom: 4px;
                  background: none;
                  border: none;
                  text-align: left;
                  cursor: pointer;
                  border-radius: 4px;
                  font-size: 14px;
                  color: #333;
                "
              >
                繁體中文
              </button>
              <button
                onclick="changeLanguage('en-us')"
                style="
                  display: block;
                  width: 100%;
                  padding: 8px 16px;
                  background: none;
                  border: none;
                  text-align: left;
                  cursor: pointer;
                  border-radius: 4px;
                  font-size: 14px;
                  color: #333;
                "
              >
                English
              </button>
            </div>
          </div>
        </div>
        <div style="margin-bottom: 5rem">
          <p
            style="
              font-size: 50px;
              font-weight: bold;
              line-height: 1.2;
              color: #214f7c;
            "
          >
            License <br />
            Management <br />
            System
          </p>
          <img src="assets/images/Group.svg" alt="" />
        </div>
      </div>
    </div>

    <!-- 請把 view 的相關 js放最前面 以免render後導致監聽事件失效-->
    <script type="text/javascript" src="views/app.view.login.js"></script>
  </body>
</html>
