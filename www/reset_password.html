<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - AVA Classroom</title>
    <link rel="icon" href="assets/images/favicon.ico" />

    <script src="modules/app.module.def.js"></script>
    <!-- Ensure locale script is loaded if app.module.def.js doesn't do it in time for inline script, though doc.write should handle it -->
    <script type="text/javascript" src="locales/app.locale.js"></script>
    <script src="modules/app.module.login.js"></script>
    <script src="modules/app.module.member.js"></script>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f5f7fa;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        display: flex;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        max-width: 960px;
        width: 100%;
      }

      .left {
        background-color: #f5f7fa;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px;
      }

      .left img.avalogo {
        height: 48px;
        margin-bottom: 24px;
      }

      .left img.illustration {
        max-width: 80%;
        margin-top: 24px;
      }

      .right {
        flex: 1;
        padding: 60px 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      h2 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #333;
      }

      .info {
        background: #f8f9fa;
        padding: 10px 15px;
        border-radius: 6px;
        font-size: 14px;
        text-align: left;
        margin-bottom: 20px;
        color: #444;
        word-break: break-word;
      }

      p.subtext {
        font-size: 13px;
        color: #777;
        margin-bottom: 32px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-bottom: 20px;
        outline: none;
        transition: border-color 0.2s ease;
      }

      input:focus {
        border-color: #1e64d6;
      }

      button {
        background: linear-gradient(90deg, #1e64d6, #2563eb);
        border: none;
        color: #fff;
        font-weight: 600;
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      button:hover {
        background: linear-gradient(90deg, #2563eb, #1e64d6);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .msg {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
      }

      .email-display {
        margin-bottom: 20px;
        font-size: 15px;
        color: #444;
        background: #f9fafc;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
          max-width: 420px;
        }
        .left {
          display: none;
        }
        .right {
          padding: 40px 30px;
        }
      }
    </style>
  </head>
  <body>
    <!-- [新增] 靜態 Loading 元素，JS 載入前就會顯示 -->
    <div id="initial-loader">
      <div class="scan">
        <img
          src="assets/images/Group (3).svg"
          alt="Loading..."
          onerror="this.style.display = 'none'"
        />
        <div class="fingerprint">
          <span class="loading-text">Loading...</span>
        </div>
      </div>
    </div>
    <div id="app" style="visibility: hidden">
      <div class="container">
        <!-- Left section -->
        <div class="left">
          <img src="assets/images/website.png" class="avalogo" alt="AVA Logo" />
          <h2>AVA LMS</h2>
          <img
            src="assets/images/Group.svg"
            class="illustration"
            alt="Illustration"
          />
        </div>

        <!-- Right section -->
        <div class="right">
          <h2 id="headerTitle">{{reset_password.header_title}}</h2>

          <div class="info" id="infoBox">{{reset_password.parsing_link}}</div>

          <p class="subtext">{{reset_password.subtext}}</p>

          <label>{{reset_password.label_email}}</label>
          <div id="email-display" class="email-display">
            {{reset_password.loading}}
          </div>

          <label for="new-password"
            >{{reset_password.label_new_password}}</label
          >
          <input
            type="password"
            id="new-password"
            placeholder="{{reset_password.placeholder_new_password}}"
          />

          <label for="repeat-password"
            >{{reset_password.label_repeat_password}}</label
          >
          <input
            type="password"
            id="repeat-password"
            placeholder="{{reset_password.placeholder_repeat_password}}"
          />

          <button id="update-btn">{{reset_password.btn_update}}</button>
          <div class="msg" id="msgBox"></div>
        </div>
      </div>
    </div>

    <script
      type="text/javascript"
      src="views/app.view.reset_password.js"
    ></script>
  </body>
</html>
