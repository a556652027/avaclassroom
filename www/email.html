<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>email</title>
    <link rel="icon" href="assets/images/favicon.ico">
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: #f5f5f5;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .email-container {
        width: 865px;
        height: 500px;
        background-color: #e6f1fd;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }

      .left-section {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .title {
        font-size: 30px;
        font-weight: bold;
        color: #214f7c;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }

      .logo-image {
        width: auto;
        height: auto;
      }

      .right-section {
        width: 434px;
        height: 362px;
        background-color: #ffffff;
        border-radius: 8px;
        padding: 32px 28px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .company-logo {
        width: 133px;
        height: auto;
      }

      .message-text {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.6;
        letter-spacing: 0.05em;
        color: #898c94;
      }

      .highlight {
        font-weight: bold;
      }

      .signature {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.6;
        letter-spacing: 0.05em;
        color: #898c94;
        display: block;
        margin-top: 10px;
      }

      .action-button {
        width: 200px;
        height: 48px;
        background-color: #ee963f;
        border: none;
        border-radius: 24px;
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .action-button:hover {
        background-color: #d8843a;
      }

      .action-button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="left-section">
        <p class="title">
          License <br />
          Management <br />
          System
        </p>
        <img src="assets/images/Group.svg" alt="Logo" class="logo-image" />
      </div>
      <div class="right-section">
        <img
          src="assets/images/empia小-03 1.svg"
          class="company-logo"
          alt="Company Logo"
        />
        <p class="message-text">
          您好，您的
          <span class="highlight">License Management System</span>
          帳號已成功建立。請點擊下方按鈕啟動您的帳號。<br />
          登入後，您就可以使用所有功能和服務！
        </p>
        <span class="signature"> The AVA Team </span>
        <a href="https://lms.narvitech.com/ava-orbital_admin/login.html"
          ><button class="action-button">前往使用</button></a
        >
      </div>
    </div>
  </body>
</html>
